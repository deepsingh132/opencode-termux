# Self-serve native build for Termux (deepsingh132/opencode-termux).
#
# Runs on GitHub-hosted ubuntu-latest (no self-hosted runner needed). Pipeline:
#   1. resolve version (manual input, else latest opencode-linux-arm64 on npm)
#   2. skip if tag native-<ver> already released
#   3. npm pack opencode-linux-arm64@<ver>
#   4. stage the prebuilt bionic libopentui.so for the TUI swap
#   5. tools/transplant/transplant.py all --no-execve
#      (graft + revive + TUI equal-length swap + report.json)
#   6. package aarch64 .deb, upload artifacts, create release native-<ver>
#
# Deliberately NOT in CI v1:
#   - seccomp-harden: the Makefile builds the shim with the host clang, which
#     would emit an x86_64 .so on ubuntu. Harden on-device instead (Termux
#     clang targets aarch64-linux-android).
#   - pacman packaging: needs makepkg + Termux makepkg.conf (absent on ubuntu).
# Runtime acceptance is on-device: x86 CI cannot execve the aarch64 product.

name: Build native opencode (self-serve)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "opencode version, e.g. 1.18.31 (blank = latest on npm)"
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Provide llvm-strip (aarch64 ELF)
        run: |
          if ! command -v llvm-strip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm
          fi
          if ! command -v llvm-strip >/dev/null 2>&1; then
            CAND="$(ls /usr/bin/llvm-strip-* 2>/dev/null | sort -V | tail -1)"
            sudo ln -sf "$CAND" /usr/local/bin/llvm-strip
          fi
          llvm-strip --version | head -1

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V="$(npm view opencode-linux-arm64 version)"
          fi
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          echo "target opencode $V"

      - name: Skip if already released
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "native-${{ steps.ver.outputs.ver }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "native-${{ steps.ver.outputs.ver }} already released; nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download opencode tgz
        if: steps.rel.outputs.exists == 'false'
        run: |
          mkdir -p work
          npm pack "opencode-linux-arm64@${{ steps.ver.outputs.ver }}" --pack-destination work/
          ls -la work/

      - name: Stage and verify bionic libopentui.so
        if: steps.rel.outputs.exists == 'false'
        run: |
          mkdir -p artifacts/transplant/opentui-bionic
          cp tools/prebuilt/libopentui-bionic.so artifacts/transplant/opentui-bionic/libopentui.so
          sha256sum artifacts/transplant/opentui-bionic/libopentui.so
          python3 -c "import sys; sys.path.insert(0,'tools/transplant'); from swap_tui import has_ffi_guard; sys.exit(0 if has_ffi_guard(open('artifacts/transplant/opentui-bionic/libopentui.so','rb').read()) else 1)"

      - name: Transplant (graft + revive + TUI swap)
        if: steps.rel.outputs.exists == 'false'
        run: |
          TGZ="$(ls work/opencode-linux-arm64-*.tgz | head -1)"
          python3 tools/transplant/transplant.py all \
            --ver "${{ steps.ver.outputs.ver }}" --tgz "$TGZ" --no-execve
          echo "=== report summary ==="
          python3 - "${{ steps.ver.outputs.ver }}" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path("artifacts/transplant") / sys.argv[1] / "report.json"
          r = json.loads(p.read_text())
          print("format:", r.get("format"))
          print("bun_base:", r.get("bun_base") or r.get("steps", {}).get("assemble", {}).get("bun_base"))
          print("revive:", r.get("steps", {}).get("revive"))
          print("swap:", r.get("steps", {}).get("swap"))
          print("tui_probe:", r.get("tui_probe"))
          PY
          ls -la "artifacts/transplant/${{ steps.ver.outputs.ver }}/"

      - name: Package .deb (aarch64)
        if: steps.rel.outputs.exists == 'false'
        run: |
          ARCH_DEB=aarch64 VERSION="${{ steps.ver.outputs.ver }}" \
            bash scripts/package/package_deb_native.sh
          ls -lh packing/dpkg-native/
          dpkg-deb --info "packing/dpkg-native/opencode_${{ steps.ver.outputs.ver }}_aarch64.deb"

      - name: Upload artifacts
        if: steps.rel.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-native-${{ steps.ver.outputs.ver }}
          if-no-files-found: warn
          path: |
            artifacts/transplant/${{ steps.ver.outputs.ver }}/
            packing/dpkg-native/*.deb
          retention-days: 30

      - name: Create release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ steps.ver.outputs.ver }}
          name: opencode ${{ steps.ver.outputs.ver }} (Termux native)
          body: |
            Self-serve native build of opencode ${{ steps.ver.outputs.ver }} for
            Termux (aarch64, Android API >= 28, zero glibc deps).

            - `opencode_<ver>_aarch64.deb` - install with `dpkg -i`
            - `opencode-native-tui` - raw single-ELF (TUI-swapped), `chmod +x`
            - `opencode-native-revived` - pre-swap product (fallback)
            - `report.json` - transplant pipeline report (swap + tui_probe)

            CI notes: no seccomp shim (harden on-device); no pacman package.
            Runtime acceptance: verify `opencode --version` + TUI on device.
          files: |
            packing/dpkg-native/*.deb
            artifacts/transplant/${{ steps.ver.outputs.ver }}/opencode-native-tui
            artifacts/transplant/${{ steps.ver.outputs.ver }}/opencode-native-revived
            artifacts/transplant/${{ steps.ver.outputs.ver }}/report.json
          fail_on_unmatched_files: false
