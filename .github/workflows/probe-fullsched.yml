# Self-serve native build for Termux (deepsingh132 fork).
#
# Pipeline (GitHub-hosted ubuntu-latest, no self-hosted runner needed):
#   1. resolve version (manual input or latest opencode-linux-arm64 on npm)
#   2. skip if tag native-<ver> already released
#   3. npm pack opencode-linux-arm64@<ver>
#   4. stage prebuilt bionic libopentui.so for the TUI swap
#   5. tools/transplant/transplant.py all --no-execve
#      (graft + revive + TUI swap + report.json)
#   6. package .deb (aarch64) + upload artifacts + create release
#
# Deliberately NOT included in CI v1 (see README notes):
#   - seccomp-harden: Makefile builds the shim with host clang, which would
#     emit an x86_64 .so on ubuntu; the .deb script ships unhardened binaries
#     cleanly. Harden on-device (Termux clang targets aarch64-android).
#   - pacman packaging: needs makepkg + Termux makepkg.conf (absent on ubuntu).
# Final runtime acceptance is on-device (x86 CI cannot execve aarch64).

name: Probe fullsched

on:
  workflow_dispatch:
    inputs:
      version:
        description: "opencode version, e.g. 1.18.31 (blank = latest on npm)"
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V="$(npm view opencode-linux-arm64 version)"
          fi
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          echo "target opencode $V"

      - name: Skip if already released
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "native-${{ steps.ver.outputs.ver }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "native-${{ steps.ver.outputs.ver }} already released; nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download opencode tgz
        if: steps.rel.outputs.exists == 'false'
        run: |
          mkdir -p work
          npm pack "opencode-linux-arm64@${{ steps.ver.outputs.ver }}" --pack-destination work/
          ls -la work/

      - name: Stage bionic libopentui.so (TUI swap)
        if: steps.rel.outputs.exists == 'false'
        run: |
          mkdir -p artifacts/transplant/opentui-bionic
          cp tools/prebuilt/libopentui-bionic.so artifacts/transplant/opentui-bionic/libopentui.so
          sha256sum artifacts/transplant/opentui-bionic/libopentui.so

      - name: Transplant (graft + revive + TUI swap)
        if: steps.rel.outputs.exists == 'false'
        run: |
          TGZ="$(ls work/opencode-linux-arm64-*.tgz | head -1)"
          python3 tools/transplant/transplant.py all \
            --ver "${{ steps.ver.outputs.ver }}" --tgz "$TGZ" --no-execve
          ls -la "artifacts/transplant/${{ steps.ver.outputs.ver }}/"

      - name: Golden regression (non-blocking)
        if: steps.rel.outputs.exists == 'false'
        continue-on-error: true
        run: |
          if [ -z "$(ls -A tests/transplant/fixtures/tgz/ 2>/dev/null)" ]; then
            bash scripts/fetch-fixtures.sh || true
          fi
          python3 tests/transplant/test_golden.py --fixtures-dir tests/transplant/fixtures/tgz || true

      - name: Package .deb (aarch64)
        if: steps.rel.outputs.exists == 'false'
        run: |
          ARCH_DEB=aarch64 VERSION="${{ steps.ver.outputs.ver }}" \
            bash scripts/package/package_deb_native.sh
          ls -lh packing/dpkg-native/
          dpkg-deb --info "packing/dpkg-native/opencode_${{ steps.ver.outputs.ver }}_aarch64.deb"

      - name: Upload artifacts
        if: steps.rel.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-native-${{ steps.ver.outputs.ver }}
          path: |
            artifacts/transplant/${{ steps.ver.outputs.ver }}/opencode-native-tui
            artifacts/transplant/${{ steps.ver.outputs.ver }}/opencode-native-revived
            artifacts/transplant/${{ steps.ver.outputs.ver }}/report.json
            packing/dpkg-native/*.deb
          retention-days: 30

      - name: Create release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ steps.ver.outputs.ver }}
          name: opencode ${{ steps.ver.outputs.ver }} (Termux native)
          body: |
            Self-serve native build of opencode ${{ steps.ver.outputs.ver }} for Termux
            (aarch64, Android API >= 28, zero glibc deps).

            - `opencode_${{ steps.ver.outputs.ver }}_aarch64.deb` — install with `dpkg -i`
            - `opencode-native-tui` — raw single-ELF (TUI-swapped); `chmod +x` and run
            - `report.json` — transplant pipeline report (incl. swap + tui_probe)

            CI v1 notes: no seccomp shim (harden on-device); no pacman package.
            Runtime acceptance: verify `opencode --version` + TUI on a real device.
          files: |
            packing/dpkg-native/*.deb
            artifacts/transplant/${{ steps.ver.outputs.ver }}/opencode-native-tui
            artifacts/transplant/${{ steps.ver.outputs.ver }}/report.json
